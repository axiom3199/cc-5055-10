<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>建筑匹配 · 镜头跟踪窗口</title>
<style>
  :root {
    --bg: #14161c; --panel: #1e222c; --line: #2c3140;
    --text: #d8dce6; --dim: #8a90a0; --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--text);
    font: 13px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; gap: 12px; align-items: flex-start;
  }
  #left { flex: 0 0 auto; }
  #view { width: 960px; max-width: calc(100vw - 380px); border: 1px solid var(--line); display: block; cursor: crosshair; background: #101218; }
  #hint { color: var(--dim); margin-top: 6px; }
  #hint b { color: var(--text); }
  #panel { flex: 1 1 300px; min-width: 300px; max-width: 400px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--accent); font-weight: 600; }
  button {
    background: #2a3040; color: var(--text); border: 1px solid #3a4258;
    border-radius: 4px; padding: 3px 10px; margin: 2px 4px 2px 0; cursor: pointer; font-size: 12px;
  }
  button:hover:not(:disabled) { background: #343c52; }
  button:disabled { opacity: 0.4; cursor: default; }
  select { background: #2a3040; color: var(--text); border: 1px solid #3a4258; border-radius: 4px; padding: 2px 4px; width: 100%; margin: 2px 0; }
  input[type=file] { color: var(--dim); font-size: 11px; max-width: 100%; }
  .row { margin: 3px 0; }
  .dim { color: var(--dim); }
  .warn { color: #f0a35e; }
  .bad { color: #e74c3c; }
  .ok { color: #2ecc71; }
  .kv { display: flex; justify-content: space-between; }
  .kv span:last-child { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  th, td { border: 1px solid var(--line); padding: 2px 6px; text-align: right; font-size: 12px; }
  th { background: #262b38; }
  td:first-child, th:first-child { text-align: left; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; }
</style>
</head>
<body>
<div id="left">
  <canvas id="view" width="960" height="540"></canvas>
  <div id="hint">
    点击线段选中，按 <b>1/2/3</b> 标为 横向X/竖向Y/纵深Z，<b>0</b> 取消分组，<b>Ctrl+Z</b> 撤销。
    黄色虚线为选中焦距候选相机对简模的投影；青色 × 为已知地面点；框出的店招给遮挡可见率预测。
  </div>
</div>
<div id="panel">
  <section>
    <h2>素材包载入</h2>
    <div class="row"><input type="file" id="filePicker" accept=".json,application/json"></div>
    <div class="row dim" id="loadInfo">正在尝试自动载入默认素材包…</div>
  </section>
  <section>
    <h2>镜头</h2>
    <div class="row"><select id="shotSel"></select></div>
    <div class="row dim" id="shotDesc"></div>
  </section>
  <section>
    <h2>建筑线分组（内核驱动）</h2>
    <div class="row">
      <button id="autoBtn" disabled>自动分组</button>
      <button id="clearBtn" disabled>清除</button>
      <button id="undoBtn" disabled>撤销</button>
    </div>
    <div class="row legend" id="grpCount" class="dim"></div>
    <div class="row legend">
      <i style="background:#e74c3c"></i>横向 X
      <i style="background:#2ecc71"></i>竖向 Y
      <i style="background:#3498db"></i>纵深 Z
      <i style="background:#888"></i>未分组
    </div>
    <div class="row" id="kernelState"><span class="dim">未载入素材包。</span></div>
  </section>
  <section>
    <h2>相机解算（建筑匹配内核）</h2>
    <div class="row"><button id="solveBtn" disabled style="font-weight:700">运行内核求解</button></div>
    <div class="row">
      <label>焦距候选：</label>
      <select id="candSel" disabled></select>
    </div>
    <div id="solInfo" class="dim"></div>
    <div class="row dim" id="residInfo"></div>
  </section>
  <section>
    <h2>跨镜头店招遮挡选解</h2>
    <div class="row"><button id="rankBtn" disabled>运行双镜头遮挡选解</button></div>
    <div class="row" id="rankInfo" class="dim"></div>
  </section>
  <section>
    <h2>预览叠加</h2>
    <div class="row">
      <label><input type="checkbox" id="showObs" checked> 观测线结构</label>
      <label><input type="checkbox" id="showModel" checked> 相机模型投影</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="showVps" checked> 灭点</label>
      <label><input type="checkbox" id="showSign" checked> 店招遮挡预测</label>
    </div>
  </section>
</div>
<script src="js/geom.js"></script>
<script src="js/street.js"></script>
<script src="js/tracking.js"></script>
</body>
</html>
